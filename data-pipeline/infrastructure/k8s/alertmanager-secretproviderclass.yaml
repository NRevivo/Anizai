# ==========================================================
# Anizai — Alertmanager SecretProviderClass (Phase 9.5 Stage C Item 4)
# ==========================================================
# Projects GMAIL_APP_PASSWORD from Secret Manager onto the
# Alertmanager pod's filesystem at /var/secrets/alertmanager/GMAIL_APP_PASSWORD.
# The alertmanager-deployment.yaml shell wrapper reads this file and
# exports it as an env var (GMAIL_APP_PASSWORD) before exec'ing the
# alertmanager binary — same shell-wrapper pattern used elsewhere
# (Flink JM/TM, Postgres, Airflow). Alertmanager's config (mounted
# from alertmanager-configmap.yaml) uses ${GMAIL_APP_PASSWORD} for
# the SMTP authentication.
#
# Spec: phase95_cluster_robustness_implementation.md Stage C Item 4.
# ==========================================================
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: alertmanager-secrets-spc
  namespace: anizai
  labels:
    app: alertmanager
    app.kubernetes.io/part-of: anizai-pipeline
    phase: "9.5"
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/anizai-pipehub/secrets/GMAIL_APP_PASSWORD/versions/latest"
        path: "GMAIL_APP_PASSWORD"
