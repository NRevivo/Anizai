# ==========================================================
# Anizai — Reactive Trigger Consumer SecretProviderClass
# ==========================================================
# Mounts the API keys for the three reactive producers that
# ingestion_trigger_consumer.py lazy-imports via _build_producer():
#   OPENWEATHER_API_KEY  — openweather_producer reactive mode
#   OPENSKY_CLIENT_ID    — opensky_producer OAuth2 token fetch
#   OPENSKY_CLIENT_SECRET — opensky_producer OAuth2 token fetch
#
# GoogleTrends reactive mode requires no API key (pytrends uses
# Google's unofficial endpoint) and is therefore not listed here.
#
# NEWSAI_API_KEY is NOT mounted — the trigger consumer's
# VALID_SOURCES frozenset is {"googletrends", "openweather", "opensky"}.
# NewsAPI is a scheduled (not reactive) producer; it has no
# run_reactive() entry point in ingestion_trigger_consumer.py.
#
# Provider: gke
# Driver: secrets-store-gke.csi.k8s.io
# No secretObjects (C3/D5).
#
# Spec: cloud_deployment_implementation.md §C4.17 (D3)
# ==========================================================
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: trigger-consumer-secrets-spc
  namespace: anizai
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/anizai-pipeline/secrets/OPENWEATHER_API_KEY/versions/latest"
        path: "OPENWEATHER_API_KEY"
      - resourceName: "projects/anizai-pipeline/secrets/OPENSKY_CLIENT_ID/versions/latest"
        path: "OPENSKY_CLIENT_ID"
      - resourceName: "projects/anizai-pipeline/secrets/OPENSKY_CLIENT_SECRET/versions/latest"
        path: "OPENSKY_CLIENT_SECRET"
