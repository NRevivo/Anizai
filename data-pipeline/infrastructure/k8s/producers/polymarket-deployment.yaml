# ==========================================================
# Anizai — Polymarket Producer Deployment
# ==========================================================
# Always-on WebSocket daemon on main-pool (Phase 9.5 F0 revert, 2026-05-19).
# Public endpoints only — no API keys, no SecretProviderClass mount.
#
# Design decision (Phase 9.5 Stage A.2, Ron 2026-05-19):
#   The original polymarket-pool design (Sprint C1 D2 revised) was REVERTED.
#   Rationale:
#     - Polymarket emits real-time prices via WebSocket; gaps cannot be
#       backfilled (push-only protocol).
#     - polymarket-pool was created to keep the producer always-on so that
#       no events would be missed — but Kafka, its destination, only runs
#       during main-pool's daily window.
#     - Result of the original design: Polymarket crash-looped with
#       NoBrokersAvailable for ~14 hours/day (1,577 restarts in 6d1h
#       observed at Phase 9.5 entry). The "buffer on Polymarket while
#       everything else is down" intent was never how the system works —
#       there is no buffering; the WebSocket data is dropped on the floor.
#     - Decision: Polymarket now runs on main-pool with every other
#       workload. When main-pool scales to 0, Polymarket stops with
#       everything else. The data gap during off-hours is acceptable;
#       the crash-loop is not.
#   The polymarket-pool node pool itself is deleted as part of F0
#   (gcloud container node-pools delete polymarket-pool ...).
#
# Why no CSI volume:
#   POLYMARKET_API_KEY/SECRET are intentionally empty — Polymarket's
#   public CLOB and Gamma endpoints require no authentication for the
#   price and comment data this producer reads (project memory).
#
# Why Recreate strategy:
#   Only one WebSocket connection at a time per credential set
#   (no rolling-update style).
#
# Spec: phase95_cluster_robustness_implementation.md F0 (Stage A.2)
#       supersedes cloud_deployment_implementation.md §C4.11 (D1, D2)
# ==========================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: polymarket
  namespace: anizai
  labels:
    app: polymarket
    tier: producer
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: polymarket
  template:
    metadata:
      labels:
        app: polymarket
        tier: producer
    spec:
      serviceAccountName: pipeline-runtime
      restartPolicy: Always
      # No nodeSelector — schedules on main-pool by default
      # (polymarket-pool deleted in F0; only main-pool remains).
      containers:
        - name: polymarket
          # Tag corrected 2026-08-14 (anizai-pipehub migration, R6).
          # Was `0.2.0-p95` (digest sha256:a2a3e82e…e93cfd5c) — FOUR rolls back
          # in the chain 0.2.0-p95 → 0.3.0-price → 0.4.0-coverage →
          # 0.4.1-inactive. cloud_state.md §3 records why the drift went
          # unnoticed: the live tag was never written down here and existed
          # only in a gitignored file on the collaborator's machine.
          #
          # `0.4.1-inactive`, digest sha256:c7b15eb7…e69dcfc4. Built from commit
          # 35c343b; drops inactive placeholder legs at selection (KG-A-20),
          # verified inside the built image rather than inferred from the build
          # (cloud_state.md §3).
          #
          # ⚠ PROVENANCE IS WEAKER HERE THAN FOR THE OTHER IMAGES — do not
          # restate this one as "what ran in cloud". The sources do not agree
          # and cannot be made to:
          #   - docs/C_cloud/archive_carryovers/carryover-20260801-window2.md
          #     §4 lists 0.4.1-inactive in the window-2 teardown table, marked
          #     new. (Archived 2026-08-15 — it describes the retired
          #     anizai-pipeline project; the tag/digest carry over.)
          #   - cloud_state.md §3 says 0.4.0-coverage was the image DEPLOYED
          #     for that window and returned to replicas: 0, and calls
          #     0.4.1-inactive the image "to roll out".
          # So 0.4.1-inactive is the latest INTENDED image and a P2-verified
          # artifact, but it may never have served traffic. It is the right tag
          # either way — both readings point here — but a future reader must not
          # inherit a "reproduces what ran" claim for this one workload.
          #
          # `0.4.0-coverage` (sha256:1d27ec05…6c43d758) is the rollback tag and
          # is pushed alongside; `0.2.0-p95` is pushed too. Neither is referenced
          # by any manifest — that is deliberate, not an oversight.
          image: us-central1-docker.pkg.dev/anizai-pipehub/anizai-images/anizai-polymarket:0.4.1-inactive
          imagePullPolicy: Always
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka:29092
          # Resources increased now that the pod runs on main-pool
          # (e2-standard-8, 32 GB RAM available). The previous
          # 30Mi request was a constraint of polymarket-pool's
          # e2-small ~34Mi allocatable budget.
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
