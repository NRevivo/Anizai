# ==========================================================
# Anizai — Polymarket producer Deployment
# ==========================================================
# SPRINT C1 SCAFFOLD — DO NOT APPLY UNTIL SPRINT C4
#
# This file is authored in C1 to capture the dual-node-pool
# nodeSelector decision at the architecture level. It is NOT
# applied during C1 (no application workloads run before C2).
# C4.11 finalizes:
#   - the actual image tag (built and pushed in C4.10),
#   - the SecretProviderClass mounting POLYMARKET_API_KEY
#     and POLYMARKET_API_SECRET.
#
# Why a dedicated node pool (Design Decision D2 — revised):
#   Polymarket emits real-time prices over WebSocket. Gaps in the
#   connection cannot be backfilled (push-only protocol, no
#   historical replay). To survive when main-pool is manually
#   scaled to zero between data-collection windows, the Polymarket
#   pod is pinned to its own always-on e2-micro pool.
#
#   nodeSelector uses the GKE-auto-applied label
#   `cloud.google.com/gke-nodepool=polymarket-pool` so the pod
#   schedules ONLY onto that pool. No tolerations are needed
#   because polymarket-pool has no taints.
#
# Spec: cloud_deployment_implementation.md §C4.11 (D2 revised)
# ==========================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: polymarket
  namespace: anizai
  labels:
    app: polymarket
    tier: producer
spec:
  replicas: 1
  strategy:
    # Recreate (not RollingUpdate) — only one WebSocket connection
    # at a time per credential set; rolling would briefly run two.
    type: Recreate
  selector:
    matchLabels:
      app: polymarket
  template:
    metadata:
      labels:
        app: polymarket
        tier: producer
    spec:
      serviceAccountName: pipeline-runtime
      restartPolicy: Always
      # Pin to polymarket-pool so the pod survives when main-pool
      # is scaled to 0. This label is auto-applied by GKE to every
      # node in the named pool — no manual node labelling needed.
      nodeSelector:
        cloud.google.com/gke-nodepool: polymarket-pool
      containers:
        - name: polymarket
          # FILLED IN C4.10 — image built from infrastructure/Dockerfile.polymarket
          image: us-central1-docker.pkg.dev/anizai-pipeline/anizai-images/anizai-polymarket:0.1.0
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka:29092
            # POLYMARKET_API_KEY + POLYMARKET_API_SECRET arrive via
            # the SecretProviderClass mount below — env projection
            # is wired in C4.11 once the SPC is finalized.
          volumeMounts:
            - name: polymarket-secrets
              mountPath: /var/secrets/polymarket
              readOnly: true
          resources:
            # e2-micro has 1 GB RAM total — leave headroom for the
            # node OS and kubelet. Conservative requests.
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "384Mi"
      volumes:
        - name: polymarket-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              # SPC `polymarket-secrets-spc` to be authored in C4.11.
              secretProviderClass: polymarket-secrets-spc
