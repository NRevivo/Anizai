# ==========================================================
# Anizai — Polymarket Producer Deployment
# ==========================================================
# Always-on WebSocket daemon pinned to polymarket-pool (e2-micro).
# Public endpoints only — no API keys, no SecretProviderClass mount.
#
# Why polymarket-pool (Design Decision D2 — Sprint C1 revised):
#   Polymarket emits real-time prices over WebSocket; gaps cannot be
#   backfilled (push-only protocol). polymarket-pool is always-on 24/7
#   and survives when main-pool is scaled to 0 between collection windows.
#
# Why no CSI volume:
#   POLYMARKET_API_KEY/SECRET are intentionally empty — Polymarket's
#   public CLOB and Gamma endpoints require no authentication for the
#   price and comment data this producer reads (project memory).
#   The CSI DaemonSet is Pending on polymarket-pool (e2-micro resource
#   pressure) so mounting a SecretProviderClass here would prevent the
#   pod from starting.
#
# Spec: cloud_deployment_implementation.md §C4.11 (D1, D2)
# ==========================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: polymarket
  namespace: anizai
  labels:
    app: polymarket
    tier: producer
spec:
  replicas: 1
  strategy:
    # Recreate: only one WebSocket connection at a time per credential set.
    type: Recreate
  selector:
    matchLabels:
      app: polymarket
  template:
    metadata:
      labels:
        app: polymarket
        tier: producer
    spec:
      serviceAccountName: pipeline-runtime
      restartPolicy: Always
      nodeSelector:
        cloud.google.com/gke-nodepool: polymarket-pool
      containers:
        - name: polymarket
          image: us-central1-docker.pkg.dev/anizai-pipeline/anizai-images/anizai-polymarket:0.1.0
          imagePullPolicy: Always
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka:29092
          resources:
            requests:
              cpu: "50m"
              # e2-micro polymarket-pool has only ~34Mi allocatable remaining
              # after system pods (fluentbit, metrics-agent, etc.) — 30Mi fits.
              memory: "30Mi"
            limits:
              cpu: "500m"
              memory: "384Mi"
