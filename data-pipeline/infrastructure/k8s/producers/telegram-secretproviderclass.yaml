# ==========================================================
# Anizai — Telegram Producer SecretProviderClass
# ==========================================================
# Mounts three secrets as files at /var/secrets/telegram/:
#   TELEGRAM_API_ID      — numeric app ID (text)
#   TELEGRAM_API_HASH    — app hash string (text)
#   TELEGRAM_SESSION_FILE — binary MTProto session state
#
# The Telegram Deployment's shell wrapper (D5):
#   1. Reads TELEGRAM_API_ID + TELEGRAM_API_HASH as env vars.
#   2. Copies TELEGRAM_SESSION_FILE to /app/anizai_telegram.session,
#      which is the path config.settings.BASE_DIR resolves to + the
#      Telethon session filename. Telethon appends '.session' to
#      SESSION_PATH at runtime, so the CSI file must be copied to the
#      full expected path including the extension.
#   3. TELEGRAM_PHONE is NOT mounted — it is only needed for the
#      one-time interactive first-login (C4.12). The session file
#      encodes the full auth state for silent re-authentication.
#
# Provider: gke  (GKE-native Secret Manager CSI add-on)
# Driver: secrets-store-gke.csi.k8s.io
# No secretObjects — GKE-native CSI does not support K8s Secret sync (C3/D5).
#
# Spec: cloud_deployment_implementation.md §C4.14 (D2, D5)
# ==========================================================
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: telegram-secrets-spc
  namespace: anizai
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/anizai-pipehub/secrets/TELEGRAM_API_ID/versions/latest"
        path: "TELEGRAM_API_ID"
      - resourceName: "projects/anizai-pipehub/secrets/TELEGRAM_API_HASH/versions/latest"
        path: "TELEGRAM_API_HASH"
      - resourceName: "projects/anizai-pipehub/secrets/TELEGRAM_SESSION_FILE/versions/latest"
        path: "TELEGRAM_SESSION_FILE"
