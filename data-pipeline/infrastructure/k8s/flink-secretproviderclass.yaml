# ==========================================================
# Anizai — Flink SecretProviderClass (Phase C, Sprint C3.3a)
# ==========================================================
# Why two secrets (not all 13):
#   config/settings.py uses os.getenv("KEY", "") for every credential
#   — confirmed in Sprint C3 OQ-1 resolution: zero os.environ["KEY"]
#   hard-crash patterns anywhere in the file. Keys absent from the pod
#   environment silently resolve to "". The only two secrets Flink jobs
#   actively use at runtime are:
#     POSTGRES_PASSWORD  — vault writes in Gold/Silver persistence layer
#     OPENAI_API_KEY     — GPT-4o enrichment in gold_job.py (§4.2)
#   Producer-only credentials (Telegram, FRED, TheNewsAPI, OpenWeather,
#   OpenSky, Polymarket) are never imported by Flink job code paths.
#
# Why file mounts only (no secretObjects):
#   The GKE-native CSI add-on (provider: gke, --enable-secret-manager)
#   supports file mounts but does NOT support the secretObjects → K8s Secret
#   sync feature. Attempting secretObjects produces:
#     FailedToCreateSecret: timed out waiting for the condition
#   confirmed during Sprint C3 first-apply attempt. File mounts work
#   correctly (same pattern validated by the Postgres pod in Sprint C2).
#
#   The Flink Deployments read the mounted files at container startup via
#   a shell wrapper command that exports the values as env vars before
#   calling /docker-entrypoint.sh. This is the Flink-idiomatic equivalent
#   of the POSTGRES_PASSWORD_FILE pattern used in the Postgres StatefulSet.
#
# provider: gke + driver secrets-store-gke.csi.k8s.io:
#   GKE-native add-on names — confirmed Sprint C1 closure.
#   Upstream provider: gcp and driver: secrets-store.csi.k8s.io are NOT
#   registered on this cluster.
#
# Apply with:
#   kubectl apply -f infrastructure/k8s/flink-secretproviderclass.yaml -n anizai
#
# Spec: cloud_deployment_implementation.md §C3.3a, §C3 D5, §9.1
# ==========================================================
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: flink-secrets-spc
  namespace: anizai
  labels:
    app.kubernetes.io/part-of: anizai-pipeline
    phase: C
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/anizai-pipehub/secrets/POSTGRES_PASSWORD/versions/latest"
        path: "POSTGRES_PASSWORD"
      - resourceName: "projects/anizai-pipehub/secrets/OPENAI_API_KEY/versions/latest"
        path: "OPENAI_API_KEY"
