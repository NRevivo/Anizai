# ==========================================================
# Anizai — Grafana ConfigMap (Phase C, Sprint C5.9)
# ==========================================================
# Contains all three provisioning files for Grafana:
#   prometheus.yml  — datasource (url: http://prometheus:9090, same as
#                      docker-compose because Kubernetes DNS resolves the
#                      ClusterIP Service name identically)
#   dashboard.yml   — provider config (path: /var/lib/grafana/dashboards)
#   anizai_pipeline.json — pre-built dashboard (16KB, schema v39)
#
# Each key is mounted via subPath in the Grafana Deployment to its exact
# expected path, so Grafana auto-provisions without any UI interaction.
# Pattern matches C2 postgres-configmap (single ConfigMap, subPath mounts).
#
# Dashboard JSON (uid: anizai-pipeline-v1) was authored in the local
# docker-compose stack and is committed verbatim. If Grafana shows
# "No data" but Prometheus targets are UP, check that the datasource
# UID in the dashboard templates matches the provisioned datasource —
# the dashboard uses a template variable (${datasource}) so the UID
# mismatch is unlikely.
#
# Apply:
#   kubectl apply -f infrastructure/k8s/grafana-configmap.yaml -n anizai
#
# Spec: cloud_deployment_implementation.md §C5.9, §C5 D3, §C5 D4, §7.2
# ==========================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: anizai
  labels:
    app: grafana
data:
  prometheus.yml: |
    apiVersion: 1

    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: false
        jsonData:
          timeInterval: "15s"
          httpMethod: POST

  dashboard.yml: |
    apiVersion: 1

    providers:
      - name: "Anizai Pipeline"
        orgId: 1
        folder: "Anizai"
        folderUid: "anizai-pipeline"
        type: file
        disableDeletion: true
        editable: true
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana/dashboards
          foldersFromFilesStructure: false

  anizai_pipeline.json: |
    {
      "__inputs": [],
      "__requires": [
        {
          "type": "grafana",
          "id": "grafana",
          "name": "Grafana",
          "version": "10.4.2"
        },
        {
          "type": "datasource",
          "id": "prometheus",
          "name": "Prometheus",
          "version": "1.0.0"
        },
        {
          "type": "panel",
          "id": "timeseries",
          "name": "Time series",
          "version": ""
        },
        {
          "type": "panel",
          "id": "stat",
          "name": "Stat",
          "version": ""
        },
        {
          "type": "panel",
          "id": "gauge",
          "name": "Gauge",
          "version": ""
        }
      ],
      "annotations": {
        "list": []
      },
      "description": "Anizai Data Pipeline — real-time Flink operator metrics (Section 7.2)",
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "panels": [
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "id": 10,
          "title": "Throughput",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "description": "Records processed per second across all Flink operators (Silver + Gold jobs). Rate computed over a 1-minute window. A flat line at 0 after job submission indicates a processing stall or DLQ flood.",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "axisBorderShow": false,
                "axisCenteredZero": false,
                "axisColorMode": "text",
                "axisLabel": "records/sec",
                "axisPlacement": "auto",
                "barAlignment": 0,
                "drawStyle": "line",
                "fillOpacity": 10,
                "gradientMode": "none",
                "hideFrom": { "legend": false, "tooltip": false, "viz": false },
                "insertNulls": false,
                "lineInterpolation": "linear",
                "lineWidth": 2,
                "pointSize": 5,
                "scaleDistribution": { "type": "linear" },
                "showPoints": "never",
                "spanNulls": false,
                "stacking": { "group": "A", "mode": "none" },
                "thresholdsStyle": { "mode": "off" }
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 80 }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 1 },
          "id": 1,
          "options": {
            "legend": { "calcs": ["mean", "lastNotNull"], "displayMode": "table", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "multi", "sort": "none" }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "rate(flink_taskmanager_job_task_operator_numRecordsIn[1m])",
              "legendFormat": "{{operator_name}} — records in/sec",
              "refId": "A"
            },
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "rate(flink_taskmanager_job_task_operator_numRecordsOut[1m])",
              "legendFormat": "{{operator_name}} — records out/sec",
              "refId": "B"
            }
          ],
          "title": "Operator Throughput (records/sec)",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "description": "Total records processed since last Flink job submission. Use this panel to confirm data is flowing after starting or restarting a job.",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "blue", "value": null }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 1 },
          "id": 2,
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "showPercentChange": false,
            "textMode": "auto",
            "wideLayout": true
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "sum(flink_taskmanager_job_task_operator_numRecordsIn) by (operator_name)",
              "legendFormat": "{{operator_name}}",
              "refId": "A"
            }
          ],
          "title": "Total Records In — Per Operator",
          "type": "stat"
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 9 },
          "id": 11,
          "title": "Latency",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "description": "Processing latency percentiles (p50, p95, p99) per Flink operator. High p95/p99 divergence from p50 indicates occasional slow records — often due to OpenAI API timeouts (Gold job) or DB contention. Values in milliseconds.",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "axisBorderShow": false,
                "axisLabel": "latency (ms)",
                "axisPlacement": "auto",
                "drawStyle": "line",
                "fillOpacity": 5,
                "lineWidth": 2,
                "pointSize": 5,
                "scaleDistribution": { "type": "linear" },
                "showPoints": "never",
                "spanNulls": false
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 1000 },
                  { "color": "red", "value": 5000 }
                ]
              },
              "unit": "ms"
            },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 10 },
          "id": 3,
          "options": {
            "legend": { "calcs": ["mean", "max"], "displayMode": "table", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "histogram_quantile(0.50, rate(flink_taskmanager_job_latency_source_id_operator_id_partition_id_bucket[5m]))",
              "legendFormat": "p50 — {{operator_id}}",
              "refId": "A"
            },
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "histogram_quantile(0.95, rate(flink_taskmanager_job_latency_source_id_operator_id_partition_id_bucket[5m]))",
              "legendFormat": "p95 — {{operator_id}}",
              "refId": "B"
            },
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "histogram_quantile(0.99, rate(flink_taskmanager_job_latency_source_id_operator_id_partition_id_bucket[5m]))",
              "legendFormat": "p99 — {{operator_id}}",
              "refId": "C"
            }
          ],
          "title": "Processing Latency — p50 / p95 / p99",
          "type": "timeseries"
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 18 },
          "id": 12,
          "title": "Checkpoints",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "description": "Flink checkpoint duration in milliseconds. High values (>30s) indicate backpressure or slow state backends. Checkpoint failures appear as spikes — correlate with the 'Last Checkpoint' stat panel to the right.",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "axisLabel": "duration (ms)",
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineWidth": 2,
                "showPoints": "never",
                "spanNulls": false
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 10000 },
                  { "color": "red", "value": 30000 }
                ]
              },
              "unit": "ms"
            },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 19 },
          "id": 4,
          "options": {
            "legend": { "calcs": ["mean", "max"], "displayMode": "table", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "multi", "sort": "none" }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "flink_jobmanager_job_lastCheckpointDuration",
              "legendFormat": "last checkpoint duration",
              "refId": "A"
            },
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "flink_jobmanager_job_lastCheckpointSize",
              "legendFormat": "last checkpoint size (bytes)",
              "refId": "B"
            }
          ],
          "title": "Checkpoint Duration & Size",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "description": "Current number of completed and failed checkpoints since last job restart. A rising failed count means exactly-once guarantees are at risk — investigate Flink logs immediately.",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 1 },
                  { "color": "red", "value": 5 }
                ]
              },
              "unit": "short"
            },
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "Completed" },
                "properties": [
                  { "id": "color", "value": { "fixedColor": "green", "mode": "fixed" } }
                ]
              },
              {
                "matcher": { "id": "byName", "options": "Failed" },
                "properties": [
                  { "id": "color", "value": { "fixedColor": "red", "mode": "fixed" } },
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        { "color": "green", "value": null },
                        { "color": "red", "value": 1 }
                      ]
                    }
                  }
                ]
              }
            ]
          },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 19 },
          "id": 5,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "horizontal",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto",
            "wideLayout": true
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "flink_jobmanager_job_numberOfCompletedCheckpoints",
              "legendFormat": "Completed",
              "refId": "A"
            },
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "flink_jobmanager_job_numberOfFailedCheckpoints",
              "legendFormat": "Failed",
              "refId": "B"
            },
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "flink_jobmanager_job_numberOfInProgressCheckpoints",
              "legendFormat": "In Progress",
              "refId": "C"
            }
          ],
          "title": "Checkpoint Status",
          "type": "stat"
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 27 },
          "id": 13,
          "title": "JVM Health",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "description": "TaskManager JVM heap memory used vs. committed. Sustained usage above 80% of committed heap leads to GC pressure and backpressure in Flink operators. Correlate with the GC time panel to confirm.",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "axisLabel": "bytes",
                "drawStyle": "line",
                "fillOpacity": 20,
                "lineWidth": 2,
                "showPoints": "never",
                "spanNulls": false
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [{ "color": "green", "value": null }]
              },
              "unit": "bytes"
            },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 28 },
          "id": 6,
          "options": {
            "legend": { "calcs": ["mean", "lastNotNull"], "displayMode": "table", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "multi", "sort": "none" }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "flink_taskmanager_Status_JVM_Memory_Heap_Used",
              "legendFormat": "Heap Used",
              "refId": "A"
            },
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "flink_taskmanager_Status_JVM_Memory_Heap_Committed",
              "legendFormat": "Heap Committed",
              "refId": "B"
            },
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "flink_taskmanager_Status_JVM_Memory_Heap_Max",
              "legendFormat": "Heap Max",
              "refId": "C"
            }
          ],
          "title": "TaskManager JVM Heap Memory",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "description": "GC time per second across all collectors. Sustained GC time >100ms/s indicates the heap is under pressure — a precursor to backpressure and checkpoint timeouts.",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "axisLabel": "ms/sec",
                "drawStyle": "bars",
                "fillOpacity": 80,
                "lineWidth": 1,
                "showPoints": "never",
                "spanNulls": false
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 50 },
                  { "color": "red", "value": 200 }
                ]
              },
              "unit": "ms"
            },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 28 },
          "id": 7,
          "options": {
            "legend": { "calcs": ["mean", "max"], "displayMode": "table", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "multi", "sort": "none" }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "rate(flink_taskmanager_Status_JVM_GarbageCollector_G1_Young_Generation_Time[1m])",
              "legendFormat": "Young GC (ms/sec)",
              "refId": "A"
            },
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "rate(flink_taskmanager_Status_JVM_GarbageCollector_G1_Old_Generation_Time[1m])",
              "legendFormat": "Old GC (ms/sec)",
              "refId": "B"
            }
          ],
          "title": "GC Time Rate",
          "type": "timeseries"
        }
      ],
      "refresh": "15s",
      "schemaVersion": 39,
      "tags": ["anizai", "flink", "pipeline"],
      "templating": {
        "list": [
          {
            "current": {},
            "hide": 0,
            "includeAll": false,
            "label": "Datasource",
            "multi": false,
            "name": "datasource",
            "options": [],
            "query": "prometheus",
            "refresh": 1,
            "regex": "",
            "type": "datasource"
          }
        ]
      },
      "time": { "from": "now-30m", "to": "now" },
      "timepicker": {},
      "timezone": "browser",
      "title": "Anizai Pipeline",
      "uid": "anizai-pipeline-v1",
      "version": 1
    }

  # ==========================================================
  # Phase 9.5 Stage C Item 6: Pipeline Health dashboard
  # ==========================================================
  # Single-screen at-a-glance "is the pipeline healthy?" view.
  # 10 panels:
  #   Row 1 (vault freshness, 4 stat panels):
  #     - knowledge_vault total + 24h delta
  #     - knowledge_vectors total + 24h delta
  #     - momentum_vault total + 1h delta
  #     - social_vault total + 6h delta
  #   Row 2 (Bronze topic activity, 1 timeseries):
  #     - messages/min per ingest.bronze.* topic
  #   Row 3 (DLQ + Flink, 2 panels):
  #     - DLQ depth gauge
  #     - Flink job state (running/canceled/failed per job)
  #   Row 4 (operational signals, 3 panels):
  #     - Recent Flink job restart count (proxy for trouble)
  #     - Recent Gold checkpoint failures
  #     - Known-silent producers (static text — operator awareness)
  #
  # All Prometheus targets use ${datasource} variable, same as the
  # existing detailed dashboard.
  anizai_pipeline_health.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [
        {
          "title": "Anizai Pipeline (detailed)",
          "url": "/d/anizai-pipeline-v1",
          "type": "link",
          "icon": "external link",
          "tags": []
        }
      ],
      "liveNow": false,
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "knowledge_vault rows",
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 0 },
          "options": {
            "graphMode": "area",
            "colorMode": "value",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }
          },
          "fieldConfig": { "defaults": { "color": { "mode": "thresholds" }, "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }] } } },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "pg_anizai_vault_rows_total_rows{tbl=\"knowledge_vault\"}",
              "legendFormat": "total",
              "refId": "A"
            },
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "sum(pg_anizai_knowledge_vault_rows_24h_rows)",
              "legendFormat": "added 24h",
              "refId": "B"
            }
          ]
        },
        {
          "id": 2,
          "type": "stat",
          "title": "knowledge_vectors rows",
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 0 },
          "options": { "graphMode": "area", "colorMode": "value", "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false } },
          "fieldConfig": { "defaults": { "color": { "mode": "thresholds" }, "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }] } } },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "pg_anizai_vault_rows_total_rows{tbl=\"knowledge_vectors\"}",
              "legendFormat": "total",
              "refId": "A"
            }
          ]
        },
        {
          "id": 3,
          "type": "stat",
          "title": "momentum_vault rows",
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 0 },
          "options": { "graphMode": "area", "colorMode": "value", "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false } },
          "fieldConfig": { "defaults": { "color": { "mode": "thresholds" }, "thresholds": { "mode": "absolute", "steps": [{ "color": "red", "value": null }, { "color": "green", "value": 1 }] } } },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "pg_anizai_vault_rows_total_rows{tbl=\"momentum_vault\"}",
              "legendFormat": "total",
              "refId": "A"
            },
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "sum(pg_anizai_momentum_vault_rows_1h_rows)",
              "legendFormat": "added 1h",
              "refId": "B"
            }
          ]
        },
        {
          "id": 4,
          "type": "stat",
          "title": "social_vault rows",
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 0 },
          "options": { "graphMode": "area", "colorMode": "value", "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false } },
          "fieldConfig": { "defaults": { "color": { "mode": "thresholds" }, "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }] } } },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "pg_anizai_vault_rows_total_rows{tbl=\"social_vault\"}",
              "legendFormat": "total",
              "refId": "A"
            },
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "sum(pg_anizai_social_vault_rows_6h_rows)",
              "legendFormat": "added 6h",
              "refId": "B"
            }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Bronze topic activity (messages/min)",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 4 },
          "options": {
            "legend": { "calcs": ["mean", "max", "lastNotNull"], "displayMode": "table", "placement": "right", "showLegend": true },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "fieldConfig": { "defaults": { "custom": { "lineWidth": 1, "fillOpacity": 10 } } },
          "targets": [
