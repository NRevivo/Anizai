# ==========================================================
# Anizai — Agent Worker SecretProviderClass (Phase C, Sprint C5.4)
# ==========================================================
# Mounts two secrets from Secret Manager for the agent-worker pod:
#   OPENAI_API_KEY   — GPT-4o synthesis + GPT-4o-mini sub-nodes (§8.11)
#   POSTGRES_PASSWORD — psycopg2 vault queries via utils/db.py (§8.4.1)
#
# Why POSTGRES_PASSWORD is here (not in the original C1 design):
#   The Sprint 18 image had stub processing only (no vault queries).
#   Sprint 19 added agent/tools/*.py which import from persistence/*.py
#   which import utils/db.py which reads config/settings.py POSTGRES_PASSWORD.
#   The Dockerfile.agent was updated in Sprint C5 to copy persistence/,
#   utils/, config/ — this SPC provides the credential those modules need.
#
# Why file mounts only (no secretObjects):
#   GKE-native CSI (provider: gke, --enable-secret-manager) supports file
#   mounts but NOT secretObjects → K8s Secret sync. Confirmed Sprint C3 D5.
#   Shell wrapper in agent-deployment.yaml exports files as env vars before
#   exec python -m agent.worker.
#
# provider: gke — GKE-native add-on (not upstream provider: gcp).
# driver: secrets-store-gke.csi.k8s.io — confirmed Sprint C1 closure.
#
# The pod that mounts this SPC must use serviceAccountName: agent-worker-ksa,
# whose GSA (agent-worker@anizai-pipeline.iam.gserviceaccount.com) holds
# roles/secretmanager.secretAccessor on anizai-pipeline (C5.1).
#
# Apply:
#   kubectl apply -f infrastructure/k8s/agent-secretproviderclass.yaml -n anizai
#
# Spec: cloud_deployment_implementation.md §C5.4, §C5 D1, §C3 D5, §9.1
# ==========================================================
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: agent-secrets-spc
  namespace: anizai
  labels:
    app.kubernetes.io/part-of: anizai-pipeline
    phase: C
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/anizai-pipeline/secrets/OPENAI_API_KEY/versions/latest"
        path: "OPENAI_API_KEY"
      - resourceName: "projects/anizai-pipeline/secrets/POSTGRES_PASSWORD/versions/latest"
        path: "POSTGRES_PASSWORD"
