# ==========================================================
# Anizai — Flink Properties ConfigMap (Phase C, Sprint C3.1)
# ==========================================================
# Why a ConfigMap:
#   FLINK_PROPERTIES is a multi-line Java-properties string that
#   Flink's entrypoint parses at startup. Storing it in a ConfigMap
#   gives a single source of truth for both the JobManager and
#   TaskManager, avoiding duplication across two Deployment manifests
#   and enabling `kubectl edit configmap flink-properties` for
#   operational tuning without rebuilding the image.
#
#   The JobManager and TaskManager have different property sets
#   (memory sizes, slot count), so two keys live under the same
#   ConfigMap. Each Deployment references its own key via
#   env.valueFrom.configMapKeyRef.
#
#   Values are lifted VERBATIM from infrastructure/docker-compose.yml
#   flink-jobmanager + flink-taskmanager FLINK_PROPERTIES blocks
#   (D2 — no semantics change between local and cloud).
#
# Apply with:
#   kubectl apply -f infrastructure/k8s/flink-properties-configmap.yaml -n anizai
#
# Spec: cloud_deployment_implementation.md §C3.1, §C3 D2, §4.3
#
# Flink HA Enablement (post-Sprint C5, corrected 2026-05-19):
#   high-availability.type: kubernetes — correct Flink 1.19 key. The alias
#     'high-availability' is deprecated and emits WARN at every startup;
#     corrected here. Enables KubernetesHaServicesFactory: job graphs +
#     leader-election state stored in K8s ConfigMaps rather than JM heap.
#   high-availability.cluster-id: anizai-flink — prefix for all HA
#     ConfigMaps (anizai-flink-dispatcher-leader, anizai-flink-
#     resourcemanager-leader, anizai-flink-<job-id>-jobgraph, etc.).
#   high-availability.storageDir: file:///opt/flink/checkpoints/ha —
#     HA metadata that overflows ConfigMap size limits lands in the ha/
#     subdirectory of the existing flink-checkpoints PVC. Flink creates
#     the ha/ directory on first startup; no PVC change required.
#   kubernetes.cluster-id: anizai-flink — REQUIRED by Fabric8FlinkKubeClient
#     in Flink 1.19 to initialize the K8s API client (Fabric8FlinkKubeClient
#     .java:98). Distinct from high-availability.cluster-id despite sharing
#     the same value; both must be set explicitly or the JM crashes with
#     "Configuration option 'kubernetes.cluster-id' is not set."
#   kubernetes.namespace: anizai — tells Flink's K8s client which
#     namespace to create ConfigMaps in. Must match the pod namespace.
#   RBAC prerequisite: pipeline-runtime KSA needs ConfigMap CRUD in the
#     anizai namespace — see flink-rbac.yaml (new file, this sprint).
# ==========================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: flink-properties
  namespace: anizai
  labels:
    app.kubernetes.io/part-of: anizai-pipeline
    phase: C
data:
  # -------- JobManager properties --------
  # Matches docker-compose flink-jobmanager FLINK_PROPERTIES verbatim.
  # jobmanager.rpc.address must match the K8s Service name (flink-jobmanager)
  # so TaskManagers resolve the RPC endpoint at flink-jobmanager:6123.
  jobmanager: |
    jobmanager.rpc.address: flink-jobmanager
    jobmanager.rpc.port: 6123
    jobmanager.memory.process.size: 1600m
    execution.checkpointing.mode: EXACTLY_ONCE
    execution.checkpointing.interval: 60000
    execution.checkpointing.min-pause: 10000
    # Phase 7B.5-I day-run (2026-07-20): checkpoint-storm mitigation. Synchronous
    # Gold enrichment (~2-3s/record, gpt-4o-mini) keeps the operator 100% CPU-busy
    # while draining any backlog; a CPU-busy operator cannot service the checkpoint
    # barrier, so checkpoints EXPIRE. With the old tolerable=0 that failed the job
    # -> restart -> replay from earliest() -> duplicate enrichment burn (same storm
    # as T7 2026-07-02). unaligned does NOT help here (it rescues network-backpressure
    # stalls, not CPU-busy-UDF stalls). The operative lever is a very high failure
    # tolerance: the job never restart-loops on checkpoint expiry, drains backlogs
    # forward, and checkpoints normally once caught up. Exactly-once tradeoff is
    # harmless: all measured data is written by fail-open Postgres INSERTs (not the
    # checkpoint sink) and analysis dedupes by DISTINCT original_url. Root fix
    # (async I/O enrichment + env-overridable offset) is deferred to the post-test cycle.
    execution.checkpointing.timeout: 600000
    execution.checkpointing.unaligned.enabled: true
    execution.checkpointing.tolerable-failed-checkpoints: 1000
    state.backend: hashmap
    state.checkpoints.dir: file:///opt/flink/checkpoints
    state.savepoints.dir: file:///opt/flink/savepoints
    restart-strategy.fixed-delay.attempts: 10
    restart-strategy.fixed-delay.delay: 20s
    execution.checkpointing.externalized-checkpoint-retention: RETAIN_ON_CANCELLATION
    metrics.reporters: prom
    metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
    metrics.reporter.prom.port: 9249
    high-availability.type: kubernetes
    high-availability.cluster-id: anizai-flink
    high-availability.storageDir: file:///opt/flink/checkpoints/ha
    kubernetes.cluster-id: anizai-flink
    kubernetes.namespace: anizai
  # -------- TaskManager properties --------
  # Matches docker-compose flink-taskmanager FLINK_PROPERTIES verbatim.
  # taskmanager.numberOfTaskSlots: 4 — 2 slots for the Silver Job,
  # 2 slots for the Gold Job.
  taskmanager: |
    jobmanager.rpc.address: flink-jobmanager
    jobmanager.rpc.port: 6123
    taskmanager.memory.process.size: 2048m
    taskmanager.numberOfTaskSlots: 4
    execution.checkpointing.mode: EXACTLY_ONCE
    execution.checkpointing.interval: 60000
    state.backend: hashmap
    state.checkpoints.dir: file:///opt/flink/checkpoints
    metrics.reporters: prom
    metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
    metrics.reporter.prom.port: 9249
    high-availability.type: kubernetes
    high-availability.cluster-id: anizai-flink
    high-availability.storageDir: file:///opt/flink/checkpoints/ha
    kubernetes.cluster-id: anizai-flink
    kubernetes.namespace: anizai
