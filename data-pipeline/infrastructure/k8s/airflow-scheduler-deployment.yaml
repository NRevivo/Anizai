# ==========================================================
# Anizai — Airflow Scheduler Deployment
# ==========================================================
# Runs the Airflow scheduler (LocalExecutor). Discovers and
# executes DAGs baked into the image at:
#   /opt/airflow/data-pipeline/orchestration/dags/
# (production mode — no volume mount per Dockerfile.airflow D2).
#
# Shell wrapper pattern (D5 — confirmed Sprint C3):
#   GKE-native CSI mounts secrets as files. The wrapper reads each
#   file and exports as an env var before exec-ing /entrypoint.
#   AIRFLOW__DATABASE__SQL_ALCHEMY_CONN is constructed inline from
#   the exported AIRFLOW_POSTGRES_PASSWORD value so the password
#   never appears as a plain environment variable in the container.
#
# Producer API keys (NEWSAI_API_KEY, FRED_API_KEY, etc.) are
# exported here because LocalExecutor runs producer tasks as
#   subprocesses of this container, inheriting its env.
#
# AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION="true" — changed from
#   "false" on 2026-08-14 (anizai-pipehub migration, R8). LOCAL PARITY
#   IS DELIBERATELY BROKEN HERE: docker-compose.yml still sets 'false'
#   and is intentionally left alone. The old comment justified "false"
#   by matching compose; that reasoning does not survive contact with a
#   rebuilt cloud metadata DB.
#
#   Why: a cloud Airflow metadata DB gets recreated (new project, new
#   airflow-postgres PVC, airflow-init re-run). On a VIRGIN metadata DB
#   this flag decides the initial pause state of every DAG, and at
#   "false" six of the seven producer DAGs are created UNPAUSED. Only
#   newsapi_dag.py carries is_paused_upon_creation=True. The fastest
#   cadence is opensky_high_frequency at */3 * * * *, so the window to
#   react is THREE MINUTES.
#
#   That is a spend hazard, not an inconvenience: under LocalExecutor
#   the producers run as subprocesses of THIS container, so ingestion
#   starts even with every producer Deployment still at replicas: 0.
#   The old project's 7/7 paused state was established by hand against
#   a live DB — a reactive gate that cannot win a three-minute race.
#
#   Making it permanent costs nothing: the flag affects only a DAG's
#   FIRST parse, so it is inert once the seven DagModel rows exist.
#   Pause/unpause afterwards is normal Airflow operation and is
#   unaffected by this value.
#
#   The same variable is set to "true" on airflow-webserver-deployment
#   for symmetry — either process may parse a DAG first and write the
#   DagModel row, so both must agree.
#
# Spec: cloud_deployment_implementation.md §C4.6 (D1, D3, D5)
# ==========================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow-scheduler
  namespace: anizai
  labels:
    app: airflow-scheduler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: airflow-scheduler
  template:
    metadata:
      labels:
        app: airflow-scheduler
    spec:
      serviceAccountName: pipeline-runtime
      containers:
        - name: airflow-scheduler
          image: us-central1-docker.pkg.dev/anizai-pipehub/anizai-images/anizai-airflow:2.9.3-7b5i
          imagePullPolicy: Always
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -e
              export AIRFLOW_POSTGRES_PASSWORD=$(cat /var/secrets/airflow/AIRFLOW_POSTGRES_PASSWORD)
              export AIRFLOW_FERNET_KEY=$(cat /var/secrets/airflow/AIRFLOW_FERNET_KEY)
              export NEWSAI_API_KEY=$(cat /var/secrets/airflow/NEWSAI_API_KEY)
              export FRED_API_KEY=$(cat /var/secrets/airflow/FRED_API_KEY)
              export OPENWEATHER_API_KEY=$(cat /var/secrets/airflow/OPENWEATHER_API_KEY)
              export OPENSKY_CLIENT_ID=$(cat /var/secrets/airflow/OPENSKY_CLIENT_ID)
              export OPENSKY_CLIENT_SECRET=$(cat /var/secrets/airflow/OPENSKY_CLIENT_SECRET)
              export AIRFLOW__DATABASE__SQL_ALCHEMY_CONN="postgresql+psycopg2://airflow:${AIRFLOW_POSTGRES_PASSWORD}@airflow-postgres/airflow"
              exec /entrypoint scheduler
          env:
            - name: AIRFLOW__CORE__EXECUTOR
              value: LocalExecutor
            - name: AIRFLOW__CORE__LOAD_EXAMPLES
              value: "false"
            # "true" since 2026-08-14 (R8) — see header. Deliberately
            # diverges from docker-compose.yml, which stays 'false'.
            - name: AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION
              value: "true"
            - name: AIRFLOW__CORE__DAGS_FOLDER
              value: /opt/airflow/data-pipeline/orchestration/dags
            - name: AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK
              value: "true"
            - name: AIRFLOW__SCHEDULER__CATCHUP_BY_DEFAULT
              value: "false"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka:29092
            - name: POSTGRES_HOST
              value: postgres
            - name: PYTHONPATH
              value: /opt/airflow/data-pipeline
          volumeMounts:
            - name: airflow-secrets
              mountPath: /var/secrets/airflow
              readOnly: true
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          livenessProbe:
            # The `airflow jobs check` exec probe cannot work here because
            # the probe subprocess gets the default container env (not PID 1's
            # environment), which lacks AIRFLOW__DATABASE__SQL_ALCHEMY_CONN.
            # Without the PostgreSQL connection, the probe checks SQLite (which
            # has no SchedulerJob record) and always fails → Kubernetes kills the
            # healthy scheduler every ~150s.
            # Fix: use the scheduler's HTTP health endpoint on port 8974
            # (exposed by AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK=true, set in
            # env: below).
            #
            # IMPORTANT (Phase 9.5 F2 correction, 2026-05-19):
            #   Port 8793 — used previously by KG-PHASE-C-4 fix — is the
            #   log-serving API (serve_logs.py), which requires a signed JWT
            #   Authorization header. Without the header it returns 403 to
            #   the kube-probe; this caused the scheduler to be killed every
            #   ~150s in a runaway crashloop (111 restarts in 10h before this
            #   fix). The correct port for scheduler health-check (when
            #   ENABLE_HEALTH_CHECK=true) is 8974.
            httpGet:
              path: /health
              port: 8974
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
      volumes:
        - name: airflow-secrets
          csi:
            driver: secrets-store-gke.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: airflow-secrets-spc
