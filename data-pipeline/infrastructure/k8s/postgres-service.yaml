# ==========================================================
# Anizai — Postgres Service (Phase C, Sprint C2.3)
# ==========================================================
# Why:
#   Headless ClusterIP service so:
#     1. StatefulSet pods get stable per-pod DNS at
#        postgres-0.postgres.anizai.svc.cluster.local — required
#        contract for StatefulSet identity. Spec C2.3.
#     2. In-cluster consumers (Flink in C3, Airflow in C4, agent
#        in C5) reach Postgres at the short name `postgres:5432`.
#     3. Local laptop access via `kubectl port-forward svc/postgres
#        5432:5432` — kubectl port-forwarding works against
#        headless services by selecting any matching pod.
#
#   No NodePort, no LoadBalancer (Phase C decision: no public
#   exposure). Per gcp-deployment skill §4 + cloud_deployment_
#   implementation.md §C2 D5.
#
# Apply with:
#   kubectl apply -f infrastructure/k8s/postgres-service.yaml
#
# Spec: cloud_deployment_implementation.md §C2.3
# ==========================================================
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: anizai
  labels:
    app: postgres
    app.kubernetes.io/part-of: anizai-pipeline
    phase: C
spec:
  # Headless service — `clusterIP: None` enables per-pod DNS for the
  # StatefulSet. Single-replica V1 still benefits from this for
  # consistency with the StatefulSet pattern (and forward-compat
  # with replicas in the future).
  clusterIP: None
  # publishNotReadyAddresses: true is REQUIRED to avoid DLQ-on-scale-cycle.
  # Without it, the headless Service does not publish DNS records for the
  # postgres pod until its readiness probe passes. The Flink Gold job
  # tries to write to momentum_vault the moment the Flink TaskManager
  # comes back during a scale 0→1 cycle, which is usually BEFORE the
  # postgres pod has finished initialisation. The DNS lookup of
  # "postgres" returns NXDOMAIN → psycopg2 raises
  # "could not translate host name 'postgres' to address" → Gold routes
  # the message to DLQ with `momentum_vault_insert` failure.
  # Phase 9.5 Stage A F6 dropped 70 momentum_vault rows this way in a
  # 28-second window. Phase 9.5 Stage B Item 1a corrects this here;
  # Stage B Item 1b adds tenacity-style retry in Gold for the residual
  # transient-error class (Postgres restart mid-write, network partition).
  # Same pattern + same rationale as kafka-service.yaml (C2 D6).
  # Spec: phase95_cluster_robustness_implementation.md Stage B fix 1a.
  publishNotReadyAddresses: true
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP
