# ==========================================================
# Anizai — kafka_exporter (Phase 9.5 Stage C Item 1a)
# ==========================================================
# Why:
#   Exposes Kafka broker + topic + partition + consumer-group state
#   as Prometheus metrics on :9308. Required by Phase 9.5 Stage C
#   alert rules:
#     - K-Kafka-1/2: DLQ growth rate (delta on dead-letter-queue)
#     - K-Kafka-3:   DLQ standing depth
#     - K-Kafka-4/5/6: Bronze topic staleness per cadence bucket
#
# Image pin: danielqsj/kafka-exporter:v1.7.0 (per Ron's Q4 confirmation).
# This is the de-facto community image; same author as the
# original prometheus/kafka_exporter project on GitHub.
#
# Connection: uses the INTERNAL Kafka listener at kafka:29092 (same
# pattern as Flink + producers). No auth required (PLAINTEXT internal).
#
# Resources: this exporter is lightweight — it polls Kafka metadata
# on each scrape (~5-15s interval). 50m CPU / 64Mi memory is enough
# at our topic count (19 topics × ~3 partitions each).
#
# Spec: phase95_cluster_robustness_implementation.md Stage C Item 1a.
# ==========================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-exporter
  namespace: anizai
  labels:
    app: kafka-exporter
    app.kubernetes.io/part-of: anizai-pipeline
    phase: "9.5"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-exporter
  template:
    metadata:
      labels:
        app: kafka-exporter
        app.kubernetes.io/part-of: anizai-pipeline
        phase: "9.5"
    spec:
      # serviceAccountName intentionally left as default — the exporter
      # only reads Kafka via plaintext network protocol; no GCP IAM
      # credentials needed.
      containers:
        - name: kafka-exporter
          image: danielqsj/kafka-exporter:v1.7.0
          imagePullPolicy: IfNotPresent
          args:
            - --kafka.server=kafka:29092
            # Refresh topic/partition metadata every 30s. Default is 30s;
            # we keep that to limit metadata-fetch load on the broker.
            - --refresh.metadata=30s
          ports:
            - name: metrics
              containerPort: 9308
              protocol: TCP
          # Lightweight resources; the exporter has a small working set.
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          # /healthz is the exporter's built-in liveness endpoint
          # (separate from the metrics scrape, returns 200 always).
          # Use /metrics for readiness — confirms the exporter has
          # connected to Kafka and is exposing data.
          readinessProbe:
            httpGet:
              path: /metrics
              port: 9308
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9308
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-exporter
  namespace: anizai
  labels:
    app: kafka-exporter
spec:
  type: ClusterIP
  selector:
    app: kafka-exporter
  ports:
    - name: metrics
      port: 9308
      targetPort: 9308
      protocol: TCP
