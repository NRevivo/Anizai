# ==========================================================
# Anizai — Airflow Postgres SecretProviderClass
# ==========================================================
# Mounts AIRFLOW_POSTGRES_PASSWORD from Secret Manager as a
# file at /var/secrets/airflow-postgres/AIRFLOW_POSTGRES_PASSWORD.
#
# The Airflow Postgres StatefulSet reads it via POSTGRES_PASSWORD_FILE
# — same pattern as the application Postgres SPC (C2).
#
# Provider: gke (GKE-native Secret Manager CSI add-on)
# Driver: secrets-store-gke.csi.k8s.io
# No secretObjects — GKE-native CSI does not support K8s Secret sync (C3/D5).
#
# Spec: cloud_deployment_implementation.md §C4.1 (D3, D5)
# ==========================================================
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: airflow-postgres-secrets-spc
  namespace: anizai
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/anizai-pipeline/secrets/AIRFLOW_POSTGRES_PASSWORD/versions/latest"
        path: "AIRFLOW_POSTGRES_PASSWORD"
