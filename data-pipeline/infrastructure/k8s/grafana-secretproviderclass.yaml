# ==========================================================
# Anizai — Grafana SecretProviderClass (Phase C, Sprint C5.9)
# ==========================================================
# Mounts GRAFANA_ADMIN_PASSWORD from Secret Manager as a file.
# The Grafana Deployment reads it via shell wrapper:
#   export GF_SECURITY_ADMIN_PASSWORD=$(cat /var/secrets/grafana/GRAFANA_ADMIN_PASSWORD)
#   exec /run.sh
#
# serviceAccountName on the pod: pipeline-runtime (shared GSA — no
# cross-project access needed for Grafana; it only scrapes in-cluster
# Prometheus). pipeline-runtime holds roles/secretmanager.secretAccessor
# on anizai-pipeline (granted in Sprint C1).
#
# provider: gke + driver secrets-store-gke.csi.k8s.io — confirmed C1/C3.
#
# Apply:
#   kubectl apply -f infrastructure/k8s/grafana-secretproviderclass.yaml -n anizai
#
# Spec: cloud_deployment_implementation.md §C5.9, §C5 D3
# ==========================================================
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: grafana-secrets-spc
  namespace: anizai
  labels:
    app.kubernetes.io/part-of: anizai-pipeline
    phase: C
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/anizai-pipeline/secrets/GRAFANA_ADMIN_PASSWORD/versions/latest"
        path: "GRAFANA_ADMIN_PASSWORD"
