# ==========================================================
# Anizai — Airflow SecretProviderClass (shared)
# ==========================================================
# Shared SPC used by: airflow-init Job, airflow-scheduler
# Deployment, airflow-webserver Deployment.
#
# Mounts all secrets needed by the Airflow stack:
#   - Airflow infrastructure: POSTGRES_PASSWORD + FERNET_KEY + ADMIN_PASSWORD
#   - Scheduled producer deps: NEWSAI_API_KEY, FRED_API_KEY,
#     OPENWEATHER_API_KEY, OPENSKY_CLIENT_ID, OPENSKY_CLIENT_SECRET
#
# AIRFLOW_ADMIN_USERNAME is NOT in Secret Manager — "admin" is
# used as a plain env var (not a credential; docker-compose default).
#
# Provider: gke (GKE-native Secret Manager CSI add-on)
# Driver: secrets-store-gke.csi.k8s.io
# No secretObjects — not supported by GKE-native CSI (C3/D5).
# Mount base: /var/secrets/airflow/<SECRET_NAME>
#
# Spec: cloud_deployment_implementation.md §C4.4, §C4.6 (D3, D5)
# ==========================================================
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: airflow-secrets-spc
  namespace: anizai
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/anizai-pipehub/secrets/AIRFLOW_POSTGRES_PASSWORD/versions/latest"
        path: "AIRFLOW_POSTGRES_PASSWORD"
      - resourceName: "projects/anizai-pipehub/secrets/AIRFLOW_FERNET_KEY/versions/latest"
        path: "AIRFLOW_FERNET_KEY"
      - resourceName: "projects/anizai-pipehub/secrets/AIRFLOW_ADMIN_PASSWORD/versions/latest"
        path: "AIRFLOW_ADMIN_PASSWORD"
      - resourceName: "projects/anizai-pipehub/secrets/NEWSAI_API_KEY/versions/latest"
        path: "NEWSAI_API_KEY"
      - resourceName: "projects/anizai-pipehub/secrets/FRED_API_KEY/versions/latest"
        path: "FRED_API_KEY"
      - resourceName: "projects/anizai-pipehub/secrets/OPENWEATHER_API_KEY/versions/latest"
        path: "OPENWEATHER_API_KEY"
      - resourceName: "projects/anizai-pipehub/secrets/OPENSKY_CLIENT_ID/versions/latest"
        path: "OPENSKY_CLIENT_ID"
      - resourceName: "projects/anizai-pipehub/secrets/OPENSKY_CLIENT_SECRET/versions/latest"
        path: "OPENSKY_CLIENT_SECRET"
