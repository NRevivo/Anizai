# ==========================================================
# Anizai — Cluster namespace (Phase C, Sprint C1.10)
# ==========================================================
# Why:
#   All Phase C workloads land in the 'anizai' namespace —
#   isolates pipeline pods, secrets, and ServiceAccounts from
#   kube-system / default / any future second app.
#   Per gcp-deployment skill §1.
#
# Apply with:
#   kubectl apply -f infrastructure/k8s/00_namespace.yaml
#
# Spec: cloud_deployment_implementation.md §C1.10
# ==========================================================
apiVersion: v1
kind: Namespace
metadata:
  name: anizai
  labels:
    app.kubernetes.io/part-of: anizai-pipeline
    phase: C
