# ==========================================================
# Anizai — Airflow Postgres StatefulSet
# ==========================================================
# Dedicated Postgres instance for Airflow's internal metadata.
# Separate from the application Postgres (design decision D1 in
# docker-compose.yml): Airflow runs alembic migrations on startup
# that must not interfere with the anizai application DDL.
#
# Pattern mirrors the application Postgres StatefulSet (C2):
#   - POSTGRES_PASSWORD_FILE reads from CSI-mounted secret file
#   - securityContext.fsGroup: 999 aligns PVC ownership with the
#     postgres uid inside the postgres:16 image
#   - standard-rwo storage class (matches all C2/C3 PVCs)
#
# Spec: cloud_deployment_implementation.md §C4.1, §8.2 (D1)
# ==========================================================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: airflow-postgres
  namespace: anizai
  labels:
    app: airflow-postgres
spec:
  serviceName: airflow-postgres
  replicas: 1
  selector:
    matchLabels:
      app: airflow-postgres
  template:
    metadata:
      labels:
        app: airflow-postgres
    spec:
      serviceAccountName: pipeline-runtime
      securityContext:
        # postgres:16 runs as uid/gid 999 — fsGroup ensures the PVC
        # mount at /var/lib/postgresql/data is owned by that gid.
        fsGroup: 999
      containers:
        - name: airflow-postgres
          image: postgres:16
          env:
            - name: POSTGRES_USER
              value: airflow
            - name: POSTGRES_DB
              value: airflow
            # Password read from CSI-mounted file — no intermediary K8s Secret.
            - name: POSTGRES_PASSWORD_FILE
              value: /var/secrets/airflow-postgres/AIRFLOW_POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
              name: postgres
          volumeMounts:
            - name: airflow-postgres-data
              mountPath: /var/lib/postgresql/data
            - name: airflow-postgres-secrets
              mountPath: /var/secrets/airflow-postgres
              readOnly: true
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "airflow", "-d", "airflow"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "airflow", "-d", "airflow"]
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
      volumes:
        - name: airflow-postgres-secrets
          csi:
            driver: secrets-store-gke.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: airflow-postgres-secrets-spc
  volumeClaimTemplates:
    - metadata:
        name: airflow-postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: standard-rwo
        resources:
          requests:
            storage: 5Gi
