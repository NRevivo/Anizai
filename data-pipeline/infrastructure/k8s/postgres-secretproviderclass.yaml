# ==========================================================
# Anizai — Postgres SecretProviderClass (Phase C, Sprint C2.2)
# ==========================================================
# Why:
#   Projects POSTGRES_PASSWORD from Secret Manager onto the
#   Postgres pod's filesystem at /var/secrets/postgres/POSTGRES_PASSWORD.
#   The official postgres entrypoint (timescaledb-ha is based on it)
#   reads POSTGRES_PASSWORD_FILE if set — this avoids creating an
#   intermediary K8s Secret and keeps the password as a file the
#   container reads on startup, never in env state.
#
#   POSTGRES_USER and POSTGRES_DB are NOT pulled from Secret Manager
#   (per Sprint C2 kickoff Q3 = option A): they are not secrets, the
#   docker-compose defaults are committed in the repo, so they live
#   as plain env vars on the StatefulSet to avoid spurious Secret
#   Manager maintenance for non-sensitive values.
#
#   provider: gke + driver name secrets-store-gke.csi.k8s.io are
#   the GKE-native add-on names (--enable-secret-manager). Upstream
#   names (provider: gcp / secrets-store.csi.k8s.io) do NOT work on
#   this cluster — confirmed in Sprint C1 closure.
#
# Apply with:
#   kubectl apply -f infrastructure/k8s/postgres-secretproviderclass.yaml
#
# Spec: cloud_deployment_implementation.md §C2.2, §C2 D1/D2/D3
# ==========================================================
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: postgres-secrets-spc
  namespace: anizai
  labels:
    app: postgres
    app.kubernetes.io/part-of: anizai-pipeline
    phase: C
spec:
  # GKE's native Secret Manager add-on registers its provider as "gke"
  # (NOT the upstream "gcp"). The CRD schema is upstream-compatible.
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/anizai-pipeline/secrets/POSTGRES_PASSWORD/versions/latest"
        path: "POSTGRES_PASSWORD"
