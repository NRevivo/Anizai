# ==========================================================
# Anizai — Prometheus ConfigMap (Phase C, Sprint C5.6)
# ==========================================================
# Scrape configuration for the three in-cluster targets:
#   flink-jobmanager  :9249  — Flink metrics reporter (D4, Sprint C3)
#   flink-taskmanager :9249  — Flink metrics reporter (new service C5.6)
#   agent-worker      :8000  — Agent /metrics endpoint (§8.8.2)
#
# 15s interval matches the Grafana datasource timeInterval setting in
# infrastructure/grafana/provisioning/datasources/prometheus.yml so
# Grafana auto-configures the minimum step correctly.
#
# Apply:
#   kubectl apply -f infrastructure/k8s/prometheus-configmap.yaml -n anizai
#
# Spec: cloud_deployment_implementation.md §C5.6, §C5 D3, §7.2
# ==========================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: anizai
  labels:
    app: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: flink-jobmanager
        static_configs:
          - targets:
              - flink-jobmanager:9249

      - job_name: flink-taskmanager
        static_configs:
          - targets:
              - flink-taskmanager:9249

      - job_name: agent-worker
        static_configs:
          - targets:
              - agent-worker:8000
        metrics_path: /metrics
