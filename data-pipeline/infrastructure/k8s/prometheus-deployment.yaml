# ==========================================================
# Anizai — Prometheus Deployment + Service (Phase C, Sprint C5.7)
# ==========================================================
# Prometheus scrapes Flink (JM + TM :9249) and the agent worker
# (:8000/metrics). TSDB stored on a 10GB PVC for ~15 days retention
# at current scrape volume. --web.enable-lifecycle allows hot-reload
# of the config via POST /-/reload without pod restart.
#
# serviceAccountName: pipeline-runtime — no WI-specific permissions
# needed for Prometheus (it only scrapes in-cluster endpoints).
#
# Local access: kubectl port-forward -n anizai svc/prometheus 9090:9090
#
# Spec: cloud_deployment_implementation.md §C5.7, §C5 D3, §7.2
# ==========================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: anizai
  labels:
    app: prometheus
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: pipeline-runtime
      securityContext:
        # Prometheus runs as nobody (UID 65534). fsGroup chowns the PVC mount
        # to GID 65534 so the process can write to /prometheus. Same pattern
        # as the Postgres fsGroup:999 fix applied in Sprint C2.
        fsGroup: 65534
      containers:
        - name: prometheus
          image: prom/prometheus:v2.51.2
          imagePullPolicy: IfNotPresent
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--web.enable-lifecycle"
            # 7-day retention bounds WAL growth. Phase 9.5 F2 finding: by
            # Sprint C5 + 9 days the TSDB had 871 WAL segments and replay
            # OOMKilled the pod at the 512Mi limit. Shorter retention +
            # higher memory limit (below) prevents recurrence.
            - "--storage.tsdb.retention.time=7d"
          ports:
            - name: web
              containerPort: 9090
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 10
          # Long initialDelaySeconds + permissive failureThreshold: on a cold
          # restart with significant WAL accumulation, Prometheus needs minutes
          # to finish WAL replay before /-/healthy starts responding 200. The
          # previous 30s delay was inadequate.
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
            initialDelaySeconds: 300
            periodSeconds: 30
            failureThreshold: 5
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
              readOnly: true
            - name: data
              mountPath: /prometheus
          # Memory raised from 512Mi → 2Gi (Phase 9.5 F2). WAL replay of
          # 871 segments needs ~1.2-1.5 GiB working set; 2Gi gives headroom.
          # If retention=7d holds the WAL bounded, normal operation uses
          # ~600 MiB.
          resources:
            requests:
              cpu: "100m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "2Gi"
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          persistentVolumeClaim:
            claimName: prometheus-data
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: anizai
  labels:
    app: prometheus
spec:
  type: ClusterIP
  selector:
    app: prometheus
  ports:
    - name: web
      port: 9090
      targetPort: 9090
      protocol: TCP
