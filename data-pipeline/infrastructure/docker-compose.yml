# ==========================================================
# Anizai Data Pipeline — Docker Compose Stack
# ==========================================================
# One-command startup of the full development environment.
# Ensures complete parity between local machine and GCP production
# — moving to GCP is a configuration change only (Section 9.1).
#
# Services (Section 8.2):
#   1. kafka            — Message broker, KRaft mode (no Zookeeper)
#   2. kafka-ui         — Web UI for topic/message inspection
#   3. kafka-init       — One-shot topic creation with retention settings
#   4. flink-jobmanager — Flink cluster coordinator
#   5. flink-taskmanager— Flink worker (Silver + Gold job slots)
#   6. postgres         — Unified DB with pgvector + TimescaleDB
#
# Producers (11 containers) are commented out below.
# Uncomment each producer as its vertical slice is implemented (Section 9.2).
#
# Usage:
#   cd data-pipeline/
#   cp .env.example .env && <fill in API keys>
#   docker compose -f infrastructure/docker-compose.yml up -d
#
# References:
#   - Section 8.1: Orchestration Strategy
#   - Section 8.2: Core Services
#   - Section 8.3: Network & Volume Persistence
#   - Section 3.1: Topic naming (used in kafka-init)
#   - Section 3.3: Retention & Lifecycle Policy
#   - Section 4.3: Flink checkpointing every 60s, EXACTLY_ONCE
# ==========================================================

services:

  # ----------------------------------------------------------
  # 1. KAFKA — KRaft mode (Section 8.2)
  # ----------------------------------------------------------
  # Single-node broker. KRaft eliminates Zookeeper dependency,
  # simplifying cluster management and reducing startup time.
  # Dual-listener setup: INTERNAL for Docker-to-Docker traffic,
  # EXTERNAL for host-to-Kafka access during producer development.
  # ----------------------------------------------------------
  kafka:
    image: apache/kafka:3.7.0
    container_name: anizai-kafka
    ports:
      - "9092:9092"   # EXTERNAL — host access for local producers
      - "29092:29092" # INTERNAL — Docker network access
    environment:
      KAFKA_NODE_ID: 0
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      # Dual listeners
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://127.0.0.1:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Auto-create topics is OFF — kafka-init creates all topics
      # explicitly with correct retention and compaction settings.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # Log settings
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 300000
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - anizai-network
    healthcheck:
      test:
        - CMD
        - /opt/kafka/bin/kafka-topics.sh
        - --bootstrap-server
        - localhost:9092
        - --list
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  # ----------------------------------------------------------
  # 2. KAFKA UI — Topic & message inspection (Section 8.2)
  # ----------------------------------------------------------
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: anizai-kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: Anizai-Cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - anizai-network

  # ----------------------------------------------------------
  # 3. KAFKA INIT — Topic creation (Section 3.1, 3.3)
  # ----------------------------------------------------------
  # One-shot service: runs after Kafka is healthy, creates all
  # topics with correct retention (Bronze=7d, Silver/Gold=3d)
  # and compaction for structured_metrics topics (Section 3.3).
  # Exits with code 0 on success; restart: on-failure for retries.
  # ----------------------------------------------------------
  kafka-init:
    image: apache/kafka:3.7.0
    container_name: anizai-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - anizai-network
    restart: on-failure
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        KAFKA=/opt/kafka/bin/kafka-topics.sh
        BS=kafka:29092

        echo "=== Creating Bronze topics (7-day retention) ==="
        BRONZE_RETENTION=604800000
        for TOPIC in \
          ingest.bronze.polymarket \
          ingest.bronze.predictit \
          ingest.bronze.telegram \
          ingest.bronze.reddit \
          ingest.bronze.hackernews \
          ingest.bronze.newsapi \
          ingest.bronze.arxiv \
          ingest.bronze.fred \
          ingest.bronze.googletrends \
          ingest.bronze.openweather \
          ingest.bronze.opensky
        do
          $$KAFKA --bootstrap-server $$BS --create --if-not-exists \
            --topic "$$TOPIC" \
            --partitions 3 \
            --replication-factor 1 \
            --config retention.ms=$$BRONZE_RETENTION \
            --config cleanup.policy=delete
          echo "  [OK] $$TOPIC"
        done

        echo "=== Creating Silver topics (3-day retention) ==="
        SILVER_RETENTION=259200000
        for TOPIC in \
          process.silver.social_pulse \
          process.silver.global_news
        do
          $$KAFKA --bootstrap-server $$BS --create --if-not-exists \
            --topic "$$TOPIC" \
            --partitions 3 \
            --replication-factor 1 \
            --config retention.ms=$$SILVER_RETENTION \
            --config cleanup.policy=delete
          echo "  [OK] $$TOPIC"
        done

        echo "=== Creating Silver structured_metrics (3-day delete) ==="
        $$KAFKA --bootstrap-server $$BS --create --if-not-exists \
          --topic process.silver.structured_metrics \
          --partitions 3 \
          --replication-factor 1 \
          --config cleanup.policy=delete \
          --config retention.ms=$$SILVER_RETENTION
        echo "  [OK] process.silver.structured_metrics"

        echo "=== Creating Gold topics (3-day retention) ==="
        GOLD_RETENTION=259200000
        for TOPIC in \
          serve.gold.social_pulse \
          serve.gold.global_news
        do
          $$KAFKA --bootstrap-server $$BS --create --if-not-exists \
            --topic "$$TOPIC" \
            --partitions 3 \
            --replication-factor 1 \
            --config retention.ms=$$GOLD_RETENTION \
            --config cleanup.policy=delete
          echo "  [OK] $$TOPIC"
        done

        echo "=== Creating Gold structured_metrics (3-day delete) ==="
        $$KAFKA --bootstrap-server $$BS --create --if-not-exists \
          --topic serve.gold.structured_metrics \
          --partitions 3 \
          --replication-factor 1 \
          --config cleanup.policy=delete \
          --config retention.ms=$$GOLD_RETENTION
        echo "  [OK] serve.gold.structured_metrics"

        echo "=== Creating System topics ==="
        # ingestion_triggers: RAG agent → on-demand requests (7-day)
        $$KAFKA --bootstrap-server $$BS --create --if-not-exists \
          --topic ingestion_triggers \
          --partitions 1 \
          --replication-factor 1 \
          --config retention.ms=604800000 \
          --config cleanup.policy=delete
        echo "  [OK] ingestion_triggers"

        # dead-letter-queue: 30-day retention for operator inspection
        $$KAFKA --bootstrap-server $$BS --create --if-not-exists \
          --topic dead-letter-queue \
          --partitions 3 \
          --replication-factor 1 \
          --config retention.ms=2592000000 \
          --config cleanup.policy=delete
        echo "  [OK] dead-letter-queue"

        echo "=== All topics created successfully ==="
        $$KAFKA --bootstrap-server $$BS --list

  # ----------------------------------------------------------
  # 4. FLINK JOBMANAGER — Cluster coordinator (Section 8.2)
  # ----------------------------------------------------------
  # Manages the Flink cluster: schedules jobs, tracks task slots,
  # coordinates checkpoints (Section 4.3).
  # Web UI on port 8081 for job monitoring and checkpoint status.
  #
  # Custom image: apache/flink:1.19.1-java11 + Python 3.11 + PyFlink 1.19.1
  # + Kafka SQL connector JAR + all project source code (see Dockerfile.flink).
  # Rollback: replace the build block below with `image: apache/flink:1.19-java11`
  # ----------------------------------------------------------
  flink-jobmanager:
    build:
      # Context is data-pipeline/ (parent of infrastructure/).
      # .dockerignore at data-pipeline/.dockerignore prunes venv/, tests/, etc.
      context: ..
      dockerfile: infrastructure/Dockerfile.flink
    image: anizai-flink:1.19.1   # named so `docker images` shows a readable tag
    container_name: anizai-flink-jobmanager
    command: jobmanager
    # Injects OPENAI_API_KEY, POSTGRES_PASSWORD, and other runtime secrets.
    # Phase 5 processing jobs (gold_job.py, translation.py) read these at
    # job-submission time. Secrets are NOT baked into the image (Section 9.1).
    env_file: .env
    ports:
      - "8081:8081" # Flink Web UI
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        jobmanager.rpc.port: 6123
        jobmanager.memory.process.size: 1600m
        # Exactly-once semantics for Silver and Gold jobs (Section 4.3)
        execution.checkpointing.mode: EXACTLY_ONCE
        # Checkpoint every 60 seconds (Section 4.3)
        execution.checkpointing.interval: 60000
        execution.checkpointing.min-pause: 10000
        execution.checkpointing.timeout: 120000
        state.backend: hashmap
        state.checkpoints.dir: file:///opt/flink/checkpoints
        state.savepoints.dir: file:///opt/flink/savepoints
        # Restart strategy: fixed-delay for transient failures
        restart-strategy: fixed-delay
        restart-strategy.fixed-delay.attempts: 5
        restart-strategy.fixed-delay.delay: 10s
        # Prometheus metrics reporter — Section 7.2
        # metrics.reporters activates the named reporter(s). Without this line
        # Flink ignores all metrics.reporter.* settings, even if the JAR is present.
        # The JAR is copied to /opt/flink/plugins/metrics-prometheus/ in LAYER 4B
        # of Dockerfile.flink — Flink's plugin classloader scans that path at startup.
        metrics.reporters: prom
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249
      # Override .env localhost values with Docker-internal hostnames (Section 8.2).
      # env_file: .env sets KAFKA_BOOTSTRAP_SERVERS=localhost:9092 and POSTGRES_HOST=localhost
      # — correct for host-side pytest runs but wrong inside Docker where services are
      # reachable by their service names on anizai-network (same fix applied to
      # airflow-scheduler at line ~487).
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      POSTGRES_HOST: postgres
    volumes:
      - flink_checkpoints:/opt/flink/checkpoints
      - flink_checkpoints:/opt/flink/savepoints
    networks:
      - anizai-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/overview"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ----------------------------------------------------------
  # 5. FLINK TASKMANAGER — Worker node (Section 8.2)
  # ----------------------------------------------------------
  # Runs the actual Flink operators. 4 task slots:
  #   - 2 slots for the Silver Job
  #   - 2 slots for the Gold Job
  # Scale task managers horizontally in GCP (Section 7.1).
  #
  # Custom image: same anizai-flink:1.19.1 image as jobmanager.
  # Both containers MUST use the same image so the Python operator bytecode
  # compiled by the JobManager is identical to what the TaskManager executes.
  # Rollback: replace the build block below with `image: apache/flink:1.19-java11`
  # ----------------------------------------------------------
  flink-taskmanager:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.flink
    image: anizai-flink:1.19.1
    container_name: anizai-flink-taskmanager
    command: taskmanager
    # Same env_file as jobmanager — TaskManager workers also need DB/OpenAI
    # credentials when executing Python operator functions (Section 9.1).
    env_file: .env
    depends_on:
      flink-jobmanager:
        condition: service_healthy
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        jobmanager.rpc.port: 6123
        taskmanager.memory.process.size: 2048m
        taskmanager.numberOfTaskSlots: 4
        # Checkpoint config must mirror JobManager (Section 4.3)
        execution.checkpointing.mode: EXACTLY_ONCE
        execution.checkpointing.interval: 60000
        state.backend: hashmap
        state.checkpoints.dir: file:///opt/flink/checkpoints
        # Prometheus metrics reporter — mirrors JobManager config (Section 7.2)
        # TaskManager is the primary metrics source: operator throughput and latency
        # are recorded here (the JobManager reports cluster-level coordination metrics).
        metrics.reporters: prom
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249
      # Override .env localhost values with Docker-internal hostnames (Section 8.2).
      # Mirrors the jobmanager override above — TaskManager workers run the Python
      # UDF operators that write to Kafka DLQ and PostgreSQL vaults, so they need
      # the same internal hostname corrections.
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      POSTGRES_HOST: postgres
    volumes:
      - flink_checkpoints:/opt/flink/checkpoints
    networks:
      - anizai-network

  # ----------------------------------------------------------
  # 6. POSTGRESQL — Multi-Vault storage engine (Section 8.2)
  # ----------------------------------------------------------
  # timescaledb-ha image ships with both TimescaleDB and pgvector
  # pre-installed — no custom Dockerfile needed.
  # init.sql is mounted to /docker-entrypoint-initdb.d/ and runs
  # automatically on first container creation (extensions + DDL).
  # ----------------------------------------------------------
  postgres:
    image: timescale/timescaledb-ha:pg16
    container_name: anizai-postgres
    ports:
      - "5432:5432" # Host access for psql / pgAdmin during development
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-anizai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-anizai}
      # timescaledb-ha runs as user 'postgres' with home /home/postgres.
      # Mounting to /home/postgres/pgdata (not /var/lib/postgresql/data)
      # is the standard fix for the Windows Docker Desktop permission error —
      # the named volume is owned by the correct uid inside the WSL2 VM.
      PGDATA: /home/postgres/pgdata/data
    volumes:
      - postgres_data:/home/postgres/pgdata
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    networks:
      - anizai-network
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-anizai} -d ${POSTGRES_DB:-anizai}
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ----------------------------------------------------------
  # 7. AIRFLOW POSTGRESQL — Metadata database (Section 2.3)
  # ----------------------------------------------------------
  # Dedicated postgres instance for Airflow's internal scheduler metadata.
  # Why separate from the anizai postgres (Design Decision D1):
  #   Airflow runs alembic schema migrations on startup. A shared instance
  #   would risk interference with the anizai application DDL managed by
  #   init.sql. Separation keeps the two databases fully independent.
  # Password sourced from .env: AIRFLOW_POSTGRES_PASSWORD (Section 9.1).
  # ----------------------------------------------------------
  airflow-postgres:
    image: postgres:16
    container_name: anizai-airflow-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_POSTGRES_PASSWORD:-airflow_localdev}
      POSTGRES_DB: airflow
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data
    networks:
      - anizai-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ----------------------------------------------------------
  # 8. AIRFLOW INIT — One-shot DB migration + admin user (Section 2.3)
  # ----------------------------------------------------------
  # Runs airflow db migrate to create the Airflow metadata schema,
  # then creates the admin user if it does not already exist.
  # Exits with code 0 on success; restart: on-failure retries until
  # airflow-postgres is ready.
  # Uses the official base image (not the custom Dockerfile.airflow)
  # because DB migration requires only core Airflow — no producer deps.
  # Downstream services wait via condition: service_completed_successfully.
  # ----------------------------------------------------------
  airflow-init:
    image: apache/airflow:2.9.3-python3.12
    container_name: anizai-airflow-init
    depends_on:
      airflow-postgres:
        condition: service_healthy
    env_file: .env
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_POSTGRES_PASSWORD:-airflow_localdev}@airflow-postgres/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_FERNET_KEY}
    networks:
      - anizai-network
    restart: on-failure
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e
        echo "=== Airflow: running DB migration ==="
        airflow db migrate
        echo "=== Airflow: provisioning admin user ==="
        if airflow users list 2>/dev/null | grep -q "${AIRFLOW_ADMIN_USERNAME:-admin}"; then
          echo "    Admin user '${AIRFLOW_ADMIN_USERNAME:-admin}' already exists — skipping."
        else
          airflow users create \
            --username "${AIRFLOW_ADMIN_USERNAME:-admin}" \
            --firstname Admin \
            --lastname User \
            --role Admin \
            --email admin@anizai.local \
            --password "${AIRFLOW_ADMIN_PASSWORD:-admin_localdev}"
          echo "    Admin user created successfully."
        fi
        echo "=== Airflow initialization complete ==="

  # ----------------------------------------------------------
  # 9. AIRFLOW SCHEDULER — DAG execution engine (Section 2.3)
  # ----------------------------------------------------------
  # Discovers and schedules DAGs from /opt/airflow/dags. Executes
  # tasks as local subprocesses (LocalExecutor — Design Decision D4).
  #
  # Custom image: apache/airflow:2.9.3-python3.12 + producer deps
  # (requests, kafka-python-ng, arxiv, pytrends — see Dockerfile.airflow).
  #
  # KAFKA_BOOTSTRAP_SERVERS override: overrides the .env value
  #   (localhost:9092) with the Docker-internal address (kafka:29092).
  #   Producer subprocesses launched by LocalExecutor run inside this
  #   container and must reach Kafka over the bridge network (Section 8.2).
  #
  # PYTHONPATH: enables PythonOperator tasks to import producers via
  #   `from ingestion.fred_producer import main` (Design Decision D3).
  #
  # Source code (Design Decision D2 — DEV mode):
  #   data-pipeline/ is volume-mounted at /opt/airflow/data-pipeline.
  #   Code changes apply on the next DAG run without an image rebuild.
  #   For production: remove the volume mount and rebuild the image.
  # ----------------------------------------------------------
  airflow-scheduler:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.airflow
    image: anizai-airflow:2.9.3
    container_name: anizai-airflow-scheduler
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    env_file: .env
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_POSTGRES_PASSWORD:-airflow_localdev}@airflow-postgres/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_FERNET_KEY}
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      # DAGs start enabled — operator can pause via UI if needed (Section 2.3).
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
      AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
      # Global catchup=False: each DAG also sets this explicitly (belt-and-suspenders).
      AIRFLOW__SCHEDULER__CATCHUP_BY_DEFAULT: 'false'
      # Override .env localhost values — producer subprocesses and persistence
      # calls run inside this container and reach services over the Docker bridge.
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      POSTGRES_HOST: postgres
      # PYTHONPATH: makes data-pipeline/ importable by PythonOperator tasks.
      PYTHONPATH: /opt/airflow/data-pipeline
    volumes:
      # DAG files — orchestration/dags/ → Airflow's default DAG discovery folder.
      - ../orchestration/dags:/opt/airflow/dags
      # Source code DEV mount — overrides the COPY in Dockerfile.airflow for local dev.
      - ../:/opt/airflow/data-pipeline
      # Task execution logs — shared with webserver for UI log display.
      - airflow_logs:/opt/airflow/logs
    networks:
      - anizai-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$(hostname)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ----------------------------------------------------------
  # 10. AIRFLOW WEBSERVER — DAG management UI (Section 2.3)
  # ----------------------------------------------------------
  # Serves the Airflow web interface on host port 8090.
  # Why 8090 (not 8080): kafka-ui already occupies port 8080 (Section 8.2).
  # Display-only: does not schedule or execute tasks — that is the
  # scheduler's responsibility. Shares the log volume so task logs
  # are visible in the UI without additional configuration.
  # ----------------------------------------------------------
  airflow-webserver:
    # No build: block — reuses the anizai-airflow:2.9.3 image built by
    # airflow-scheduler. Both services run identical code; building once
    # avoids the BuildKit concurrent-tag race when both share the same
    # image name (same fix as flink-taskmanager reusing the flink JM image).
    image: anizai-airflow:2.9.3
    container_name: anizai-airflow-webserver
    command: webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-scheduler:
        condition: service_healthy
    env_file: .env
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_POSTGRES_PASSWORD:-airflow_localdev}@airflow-postgres/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_FERNET_KEY}
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      # Show the full Airflow config in the UI — useful for dev debugging.
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: 'true'
      PYTHONPATH: /opt/airflow/data-pipeline
    ports:
      - "8090:8080"
    volumes:
      - ../orchestration/dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs
    networks:
      - anizai-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ----------------------------------------------------------
  # 11. PROMETHEUS — Metrics collection (Section 7.2)
  # ----------------------------------------------------------
  # Scrapes Flink jobmanager and taskmanager Prometheus reporters
  # on port 9249 every 15 seconds. Operator-level metrics exposed:
  #   - numRecordsIn / numRecordsOut (throughput per operator)
  #   - latency (processing latency histogram)
  #   - checkpoint duration + lag (pipeline health)
  #   - JVM memory / GC (backpressure detection)
  # Config file is volume-mounted (not baked into image) so scrape targets
  # can be updated without an image rebuild.
  # ----------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: anizai-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"  # allows POST /-/reload to hot-reload config
    depends_on:
      flink-taskmanager:
        condition: service_started
    networks:
      - anizai-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ----------------------------------------------------------
  # 12. GRAFANA — Metrics visualization (Section 7.2)
  # ----------------------------------------------------------
  # Connects to Prometheus as a datasource (auto-provisioned via
  # infrastructure/grafana/provisioning/datasources/).
  # Pre-built dashboard is loaded from
  # infrastructure/grafana/dashboards/ via provisioning config,
  # so the pipeline dashboard is available immediately on first login
  # without any manual UI setup.
  # Port 3000 chosen: no conflict with kafka-ui (8080), Flink (8081),
  # Airflow (8090), Prometheus (9090).
  # Admin credentials: GRAFANA_ADMIN_PASSWORD from .env (Section 9.1).
  # ----------------------------------------------------------
  grafana:
    image: grafana/grafana:10.4.2
    container_name: anizai-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin_localdev}
      # Disable sign-up — this is an internal observability tool (Section 9.1)
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Provisioning dirs: datasources + dashboards loaded at startup
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      - anizai-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ----------------------------------------------------------
  # 13. AGENT WORKER — Agentic Hub (Section 8.10)
  # ----------------------------------------------------------
  # Forecast worker: subscribes to Firestore forecastQueries where
  # status=='pending', atomically claims a doc, processes it through
  # process_query (Sprint 18 stub; real LangGraph reasoning in Sprint 19+),
  # and writes a SessionResult. See agent/worker.py for the lifecycle.
  #
  # Sprint 18 dev model: the service is defined here for T13 manual
  # validation, but day-to-day Sprint 18 development runs the worker
  # host-side against a host-side Firestore emulator (per T1 decision).
  # When the container does run, FIRESTORE_EMULATOR_HOST below uses
  # host.docker.internal so it still reaches the host-side emulator.
  #
  # extra_hosts: explicit host-gateway mapping makes host.docker.internal
  # resolve on Linux. Docker Desktop (Mac/Windows) resolves it natively;
  # Linux requires the explicit alias.
  #
  # depends_on: omitted — the hub doesn't talk to Postgres in Sprint 18
  # (vault reads land Sprint 19+), doesn't talk to Kafka, and the
  # Firestore emulator runs host-side so compose can't depend on it.
  #
  # restart: unless-stopped pairs with worker.py's listener-error
  # exit-non-zero policy: any fatal listener error becomes a container
  # restart, surfaced via Docker's restart-counter (Section 8.8.2).
  # ----------------------------------------------------------
  agent-worker:
    build:
      # Same convention as flink-jobmanager / airflow-scheduler: build
      # context is data-pipeline/ (parent of infrastructure/).
      context: ..
      dockerfile: infrastructure/Dockerfile.agent
    image: anizai-agent:0.1.0
    container_name: anizai-agent-worker
    env_file: .env
    environment:
      # Container-only override — host-side workers default to
      # localhost:8080 via the unset/.env value (per Sprint 18 T9 decision:
      # FIRESTORE_EMULATOR_HOST is NOT set in the shared .env so host
      # Python doesn't try to resolve host.docker.internal).
      FIRESTORE_EMULATOR_HOST: host.docker.internal:8080
      # Bind health server to all interfaces inside the container so
      # the host port mapping below reaches it. settings.py already
      # defaults to 0.0.0.0; this is belt-and-suspenders.
      HUB_HEALTH_HOST: 0.0.0.0
    extra_hosts:
      # Linux requires explicit host-gateway aliasing for
      # host.docker.internal. Mac/Windows Docker Desktop handles it natively.
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"  # HUB_HEALTH_PORT — internal monitoring only
    networks:
      - anizai-network
    restart: unless-stopped
    healthcheck:
      # Python urllib instead of curl — curl is intentionally not
      # installed in the agent image (Dockerfile.agent LAYER 3 note).
      # status==200 only counts ready: /health returns 503 during
      # 'starting' and 'draining' states, so start_period must cover
      # the worst-case init_app + listener-subscribe time.
      test: ["CMD", "python", "-c", "import urllib.request,sys; r=urllib.request.urlopen('http://localhost:8000/health',timeout=2); sys.exit(0 if r.status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    # Production-only — uncomment and fill in when deploying outside
    # the local emulator. Dev uses ADC against the emulator and does
    # NOT need a service-account JSON file.
    # volumes:
    #   - /path/to/service-account.json:/secrets/sa.json:ro
    # environment:  (merge with active environment block above)
    #   GOOGLE_APPLICATION_CREDENTIALS: /secrets/sa.json

  # ----------------------------------------------------------
