# ==========================================================
# VOLUMES — mandatory for data persistence (Section 8.3)
# ==========================================================
volumes:
  kafka_data:
    driver: local
  postgres_data:
    driver: local
  flink_checkpoints:
    driver: local
  # Airflow metadata DB — dedicated volume for the airflow-postgres container.
  # Separate from postgres_data to prevent any cross-contamination with the
  # anizai application database (Design Decision D1, Section 8.3).
  airflow_postgres_data:
    driver: local
  # Airflow task execution logs — shared between airflow-scheduler and
  # airflow-webserver so that the UI can display log output without a
  # remote log backend (acceptable for local development, Section 7.2).
  airflow_logs:
    driver: local
  # Prometheus time-series data — retains 15 days of metrics (Section 7.2).
  prometheus_data:
    driver: local
  # Grafana configuration and dashboard state (Section 7.2).
  # Pre-built dashboards are provisioned read-only from the host mount;
  # this volume holds Grafana's own DB (annotations, user prefs, etc.).
  grafana_data:
    driver: local


# ==========================================================
# NETWORK — unified bridge network (Section 8.3)
# ==========================================================
networks:
  anizai-network:
    driver: bridge
