services:
  # ==========================================
  # 1. CORE INFRASTRUCTURE (Kafka - Official Apache Image)
  # ==========================================
  kafka:
    image: apache/kafka:3.7.0
    container_name: anazai-kafka
    ports:
      - "9092:9092" # External access (host)
      - "29092:29092" # Internal access (Docker network)
    environment:
      # KRaft settings (no Zookeeper)
      - KAFKA_NODE_ID=0
      - KAFKA_PROCESS_ROLES=controller,broker
      - KAFKA_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      # Dual listeners: INTERNAL for Docker, EXTERNAL for host
      - KAFKA_LISTENERS=INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=INTERNAL://kafka:29092,EXTERNAL://127.0.0.1:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      - KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER

    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - anazai-network

  # Web UI (connects via INTERNAL listener)
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: anazai-kafka-ui
    ports:
      - "8080:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=Anazai-Cluster
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:29092
    depends_on:
      - kafka
    networks:
      - anazai-network
