version: '3.8'

services:
  # ==========================================
  # 1. CORE INFRASTRUCTURE (Kafka - KRaft Mode)
  # ==========================================
  kafka:
    image: bitnami/kafka:3.5
    container_name: anazai-kafka
    ports:
      - "9092:9092" # External access (from your Python script on host)
    environment:
      # KRaft settings (No Zookeeper needed!)
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
    volumes:
      - kafka_data:/bitnami/kafka
    networks:
      - anazai-network

  # ממשק גרפי לראות את ההודעות שנכנסות (קריטי לבדיקות!)
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: anazai-kafka-ui
    ports:
      - "8080:8080" # כנס לדפדפן בכתובת localhost:8080
    environment:
      - KAFKA_CLUSTERS_0_NAME=Anazai-Cluster
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092
    depends_on:
      - kafka
    networks:
      - anazai-network

