[pytest]
# `src` on the path so `import calibration` resolves to src/calibration.
# This is what lets the suite run from this directory with no installation
# step and no dependency on the rest of the repository.
pythonpath = src
testpaths = tests
addopts = -q

# The repository root also holds `data-pipeline/tests/conftest.py`, which
# imports the pipeline's database layer. Nothing here depends on that, and
# pulling it in would make this suite require the pipeline's dependencies —
# so collection stops at this directory.
#
# When invoking pytest from the repository root rather than from here, pass
#   --confcutdir=calibration
# explicitly; an ini file cannot set it.
